<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BABA General Store - Receipt</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; }
  header {
    background: #1e3a5f; color: white; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  header button {
    background: #c0392b; color: white; border: none; padding: 6px 14px;
    border-radius: 4px; cursor: pointer; margin-left: 12px; font-size: 13px;
  }
  nav { max-width: 700px; margin: 16px auto 0; padding: 0 16px; font-size: 13px; }
  nav a { color: #2c5282; text-decoration: none; margin-right: 16px; }
  .container { max-width: 700px; margin: 16px auto 24px; padding: 0 16px; }
  .receipt-card {
    background: white; border-radius: 8px; padding: 30px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .shop-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #1e3a5f; padding-bottom: 14px; }
  .shop-header h2 { margin: 0; color: #1e3a5f; font-size: 22px; }
  .shop-header p { margin: 4px 0 0; color: #666; font-size: 13px; }
  .meta-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 16px; color: #444; }
  .student-block { background: #f4f6f8; border-radius: 6px; padding: 12px; margin-bottom: 16px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
  th { color: #666; }
  .totals-block { margin-left: auto; width: 260px; font-size: 14px; }
  .totals-block div { display: flex; justify-content: space-between; padding: 4px 0; }
  .totals-block .grand { font-weight: 700; font-size: 16px; border-top: 1px solid #333; padding-top: 8px; margin-top: 4px; }
  .status-tag { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .status-Paid { background: #e8f5e9; color: #1e7e34; }
  .status-Partial { background: #fff8e1; color: #b8860b; }
  .status-Due { background: #fdecea; color: #c0392b; }
  .actions { text-align: center; margin-top: 20px; }
  .btn-primary {
    background: #2c5282; color: white; border: none; padding: 10px 20px;
    border-radius: 4px; font-size: 14px; cursor: pointer; margin: 6px;
  }
  .btn-whatsapp { background: #1e7e34; }
  .btn-whatsapp:disabled { background: #999; cursor: not-allowed; }
  .footer-note { text-align: center; font-size: 12px; color: #999; margin-top: 20px; }
  .phone-note { text-align: center; font-size: 12px; color: #999; margin-top: 4px; }
  .print-options {
    background: white; border-radius: 8px; padding: 18px; margin-top: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); text-align: center;
  }
  .print-options label { font-size: 13px; font-weight: 600; color: #444; margin-right: 8px; }
  .print-options select {
    padding: 7px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; margin-bottom: 14px;
  }
  .copy-btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-copy {
    background: #2c5282; color: white; border: none; padding: 10px 18px;
    border-radius: 4px; font-size: 13px; cursor: pointer;
  }
  .btn-copy.shop { background: #6b4fa0; }
  .btn-copy.both { background: #1e3a5f; }

  /* Print-only content, hidden on screen */
  #printArea { display: none; }
  .copy-label {
    text-align: center; font-weight: 700; font-size: 11px; color: #666;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
  }
  .cut-line {
    text-align: center; font-size: 10px; color: #999; margin: 10px 0;
    border-top: 1px dashed #999; padding-top: 4px;
  }
  .print-copy { padding: 14px 0; }

  @media print {
    header, nav, .actions, .print-options { display: none; }
    body { background: white; }
    .container { max-width: 100%; margin: 0; padding: 0; }
    #screenView { display: none; }
    #printArea { display: block; }
    .receipt-card { box-shadow: none; padding: 0; }
  }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=5">
<script src="app.js?v=5"></script>
</head>
<body>

<header>
  <h1><strong>BABA General Store</strong> — Receipt</h1>
  <div><button onclick="logout()">Log Out</button></div>
</header>

<nav>
  <a href="dashboard.html">Dashboard</a>
  <a href="billing.html">New Bill</a>
</nav>

<div class="container">
  <div id="screenView">
    <div class="receipt-card" id="receiptCard">
      <div class="shop-header">
        <h2>BABA General Store</h2>
        <p>Uniform Shop — Shahpur &amp; Telaiya Dam</p>
      </div>
      <div id="content">Loading receipt...</div>
    </div>
  </div>

  <!-- Print-only content gets built fresh into here right before each print action -->
  <div id="printArea"></div>

  <div class="print-options">
    <div>
      <label for="printerType">Printer / Paper Type:</label>
      <select id="printerType">
        <option value="a4">Full Page (A4)</option>
        <option value="80mm">80mm Thermal Roll</option>
        <option value="58mm">58mm Thermal Roll</option>
      </select>
    </div>
    <div class="copy-btn-row">
      <button class="btn-copy" onclick="printReceipt('customer')">🧾 Print for Customer</button>
      <button class="btn-copy shop" onclick="printReceipt('shop')">🏪 Print for Shop</button>
      <button class="btn-copy both" onclick="printReceipt('both')">📄 Print Both</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary btn-whatsapp" id="whatsappBtn" onclick="sendWhatsApp()" disabled>Send on WhatsApp</button>
    <button class="btn-primary" style="background:#555;" onclick="window.location.href='billing.html'">New Bill</button>
  </div>
  <div class="phone-note" id="phoneNote"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwvIJ2hqiz_QfMZonLs0Qs9sCvSo6hYLsbKlyw_oNB8G4IyHjFlJmlG3RbrIkVw_FrS/exec";
  const token = localStorage.getItem("uniformerp_token");
  let currentBill = null, currentStudent = null, currentItems = null;
  let branchIdentityMap = {};

  if (!token) window.location.href = "login.html";

  function logout() { localStorage.clear(); window.location.href = "login.html"; }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function getBillIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("billId") || localStorage.getItem("lastBillId");
  }

  async function loadBranchIdentities() {
    try {
      const res = await fetch(API_URL + "?action=listBranches&token=" + encodeURIComponent(token));
      const data = await res.json();
      if (data.success) {
        data.data.forEach(function (b) {
          branchIdentityMap[String(b.BranchName).trim().toLowerCase()] = {
            businessName: b.BusinessName || "BABA General Store",
            address: b.Address || b.BranchName
          };
        });
      }
    } catch (err) {
      console.error("[UniformERP] Failed to load branch identities:", err);
    }
  }

  /** Returns {businessName, address} for a given branch, with a safe fallback if not found. */
  function getBranchIdentity(branchName) {
    const key = String(branchName || "").trim().toLowerCase();
    return branchIdentityMap[key] || { businessName: "BABA General Store", address: branchName || "" };
  }

  function totalsBlockHtml(bill) {
    const hasDiscount = Number(bill.DiscountAmount) > 0;
    const subtotal = hasDiscount ? (Number(bill.TotalAmount) + Number(bill.DiscountAmount)) : bill.TotalAmount;
    let html = "";
    if (hasDiscount) {
      html += "<div><span>Subtotal</span><span>₹" + subtotal.toFixed(2) + "</span></div>";
      html += "<div><span>Discount</span><span>-₹" + Number(bill.DiscountAmount).toFixed(2) + "</span></div>";
    }
    html += "<div" + (hasDiscount ? "" : " class='grand'") + "><span>Total Amount</span><span>₹" + bill.TotalAmount + "</span></div>";
    html += "<div><span>Amount Paid</span><span>₹" + bill.AmountPaid + "</span></div>";
    html += "<div class='grand'><span>Amount Due</span><span>₹" + bill.AmountDue + "</span></div>";
    return html;
  }

  /** Full-size A4 receipt layout (shop header, table, totals block) — used for the screen view and A4 printing. */
  function buildReceiptHtml(bill, student, items, copyLabel) {
    let itemsHtml = "";
    items.forEach(function (it) {
      itemsHtml +=
        "<tr>" +
        "<td>" + escapeHtml(it.ProductName) + " (" + escapeHtml(it.ColourName) + ", " + escapeHtml(it.SizeName) + ")</td>" +
        "<td>" + it.Qty + "</td>" +
        "<td>₹" + it.UnitPrice + "</td>" +
        "<td>₹" + it.LineTotal + "</td>" +
        "</tr>";
    });

    const billDate = new Date(bill.BillDate).toLocaleDateString();
    const identity = getBranchIdentity(bill.Branch);

    return (
      (copyLabel ? "<div class='copy-label'>" + escapeHtml(copyLabel) + "</div>" : "") +
      "<div class='shop-header'>" +
        "<h2>" + escapeHtml(identity.businessName) + "</h2>" +
        "<p>Uniform Shop — " + escapeHtml(identity.address) + "</p>" +
      "</div>" +
      "<div class='meta-row'>" +
        "<span>Bill No: <strong>" + escapeHtml(bill.BillNo) + "</strong></span>" +
        "<span>Date: " + billDate + "</span>" +
      "</div>" +
      "<div class='student-block'>" +
        "<strong>" + escapeHtml(student.StudentName || "Walk-in Customer") + "</strong><br>" +
        "Admission No: " + escapeHtml(student.AdmissionNo || "-") + "<br>" +
        (student.ParentPhone ? "Phone: " + escapeHtml(student.ParentPhone) : "") +
      "</div>" +
      "<table>" +
        "<thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>" +
        "<tbody>" + itemsHtml + "</tbody>" +
      "</table>" +
      "<div class='totals-block'>" + totalsBlockHtml(bill) + "</div>" +
      "<div style='text-align:center; margin-top:14px;'>" +
        "<span class='status-tag status-" + bill.Status + "'>" + bill.Status + "</span>" +
      "</div>" +
      "<div class='footer-note'>Thank you for shopping with us — " + escapeHtml(identity.businessName) + "</div>"
    );
  }

  /** Compact receipt layout for thermal roll printers. widthMm controls the paper size (58 or 80). */
  function buildThermalHtml(bill, student, items, copyLabel, widthMm) {
    const usableWidth = widthMm - 6; // leave ~3mm margin each side
    const fontSize = widthMm <= 58 ? "10px" : "11px";
    const titleSize = widthMm <= 58 ? "12px" : "13px";

    let itemsHtml = "";
    items.forEach(function (it) {
      itemsHtml +=
        "<div style='margin-bottom:3px;'>" +
          "<div>" + escapeHtml(it.ProductName) + " (" + escapeHtml(it.ColourName) + ", " + escapeHtml(it.SizeName) + ")</div>" +
          "<div style='display:flex; justify-content:space-between;'>" +
            "<span>" + it.Qty + " x ₹" + it.UnitPrice + "</span><span>₹" + it.LineTotal + "</span>" +
          "</div>" +
        "</div>";
    });

    const billDate = new Date(bill.BillDate).toLocaleDateString();
    const hasDiscount = Number(bill.DiscountAmount) > 0;
    const subtotal = hasDiscount ? (Number(bill.TotalAmount) + Number(bill.DiscountAmount)) : bill.TotalAmount;
    const dashes = "-".repeat(widthMm <= 58 ? 28 : 36);
    const identity = getBranchIdentity(bill.Branch);

    let totalsHtml = "";
    if (hasDiscount) {
      totalsHtml += "<div style='display:flex; justify-content:space-between;'><span>Subtotal</span><span>₹" + subtotal.toFixed(2) + "</span></div>";
      totalsHtml += "<div style='display:flex; justify-content:space-between;'><span>Discount</span><span>-₹" + Number(bill.DiscountAmount).toFixed(2) + "</span></div>";
    }
    totalsHtml += "<div style='display:flex; justify-content:space-between; font-weight:bold;'><span>TOTAL</span><span>₹" + bill.TotalAmount + "</span></div>";
    totalsHtml += "<div style='display:flex; justify-content:space-between;'><span>Paid</span><span>₹" + bill.AmountPaid + "</span></div>";
    totalsHtml += "<div style='display:flex; justify-content:space-between;'><span>Due</span><span>₹" + bill.AmountDue + "</span></div>";

    return (
      "<div style='width:" + usableWidth + "mm; font-family:\"Courier New\",monospace; font-size:" + fontSize + "; color:#000; line-height:1.45;'>" +
        (copyLabel ? "<div style='text-align:center; font-weight:bold; margin-bottom:4px;'>*** " + escapeHtml(copyLabel) + " ***</div>" : "") +
        "<div style='text-align:center; font-weight:bold; font-size:" + titleSize + ";'>" + escapeHtml(identity.businessName.toUpperCase()) + "</div>" +
        "<div style='text-align:center;'>" + escapeHtml(identity.address) + "</div>" +
        "<div>" + dashes + "</div>" +
        "<div>Bill No: " + escapeHtml(bill.BillNo) + "</div>" +
        "<div>Date: " + billDate + "</div>" +
        "<div>" + dashes + "</div>" +
        "<div>" + escapeHtml(student.StudentName || "Walk-in Customer") + "</div>" +
        "<div>Adm# " + escapeHtml(student.AdmissionNo || "-") + "</div>" +
        "<div>" + dashes + "</div>" +
        itemsHtml +
        "<div>" + dashes + "</div>" +
        totalsHtml +
        "<div style='text-align:center; margin-top:4px;'>[" + bill.Status.toUpperCase() + "]</div>" +
        "<div>" + dashes + "</div>" +
        "<div style='text-align:center;'>Thank you for shopping with us!</div>" +
        "<div style='height:8mm;'></div>" +
      "</div>"
    );
  }

  async function loadReceipt() {
    const billId = getBillIdFromUrl();
    if (!billId) {
      document.getElementById("content").innerHTML = "<p>No bill specified.</p>";
      return;
    }

    await loadBranchIdentities();

    const res = await fetch(API_URL + "?action=getBillDetails&token=" + encodeURIComponent(token) + "&billId=" + encodeURIComponent(billId));
    const data = await res.json();

    if (!data.success) {
      document.getElementById("content").innerHTML = "<p>" + escapeHtml(data.message) + "</p>";
      return;
    }

    currentBill = data.data.bill;
    currentStudent = data.data.student;
    currentItems = data.data.items;

    const identity = getBranchIdentity(currentBill.Branch);
    document.querySelector("#receiptCard .shop-header h2").textContent = identity.businessName;
    document.querySelector("#receiptCard .shop-header p").textContent = "Uniform Shop — " + identity.address;

    document.getElementById("content").innerHTML = buildReceiptHtml(currentBill, currentStudent, currentItems, "");

    const whatsappBtn = document.getElementById("whatsappBtn");
    if (currentStudent.ParentPhone) {
      whatsappBtn.disabled = false;
    } else {
      whatsappBtn.disabled = true;
      document.getElementById("phoneNote").textContent = "No parent phone number on file for this student — add one via Students page to enable WhatsApp sending.";
    }
  }

  /**
   * Unified print handler. copyMode: 'customer' | 'shop' | 'both'.
   * Reads the currently selected printer/paper type and builds the right layout,
   * injecting a temporary @page rule so the browser's print dialog sizes correctly.
   */
  function printReceipt(copyMode) {
    if (!currentBill) return;
    const paperType = document.getElementById("printerType").value;
    const printArea = document.getElementById("printArea");

    const copies = [];
    if (copyMode === "customer" || copyMode === "both") copies.push("Parent's Copy");
    if (copyMode === "shop" || copyMode === "both") copies.push("Shopkeeper's Copy");
    // Single-copy prints don't need a label at all
    const useLabels = copies.length > 1;

    let html = "";
    let pageRule = "";

    if (paperType === "a4") {
      pageRule = "@page { size: A4; margin: 15mm; }";
      copies.forEach(function (label, idx) {
        html += "<div class='print-copy'>" + buildReceiptHtml(currentBill, currentStudent, currentItems, useLabels ? label : "") + "</div>";
        if (idx < copies.length - 1) {
          html += "<div class='cut-line'>✂ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - ✂</div>";
        }
      });
    } else {
      const widthMm = paperType === "58mm" ? 58 : 80;
      pageRule = "@page { size: " + widthMm + "mm auto; margin: 2mm; }";
      copies.forEach(function (label) {
        html += buildThermalHtml(currentBill, currentStudent, currentItems, useLabels ? label : "", widthMm);
      });
    }

    printArea.innerHTML = html;

    // Inject a temporary stylesheet with the right @page size for this print job, then clean up afterward.
    const styleTag = document.createElement("style");
    styleTag.id = "uerp-print-page-style";
    styleTag.textContent = pageRule;
    document.head.appendChild(styleTag);

    window.onafterprint = function () {
      const tag = document.getElementById("uerp-print-page-style");
      if (tag) tag.remove();
      printArea.innerHTML = "";
      window.onafterprint = null;
    };

    window.print();
  }

  function normalizePhone(raw) {
    let digits = String(raw || "").replace(/\D/g, "");
    if (digits.length === 10) digits = "91" + digits; // default to India country code
    return digits;
  }

  function sendWhatsApp() {
    if (!currentBill || !currentStudent) return;
    const phone = normalizePhone(currentStudent.ParentPhone);
    if (!phone) {
      alert("No parent phone number available for this student.");
      return;
    }

    const billDate = new Date(currentBill.BillDate).toLocaleDateString();
    let itemLines = "";
    currentItems.forEach(function (it) {
      itemLines += "- " + it.ProductName + " (" + it.ColourName + ", " + it.SizeName + ") x" + it.Qty + " = ₹" + it.LineTotal + "\n";
    });

    let message =
      "*" + getBranchIdentity(currentBill.Branch).businessName + "* — Bill Receipt\n" +
      "Bill No: " + currentBill.BillNo + "\n" +
      "Date: " + billDate + "\n" +
      "Student: " + (currentStudent.StudentName || "-") + " (Adm# " + (currentStudent.AdmissionNo || "-") + ")\n\n" +
      "Items:\n" + itemLines + "\n";

    if (Number(currentBill.DiscountAmount) > 0) {
      const subtotal = Number(currentBill.TotalAmount) + Number(currentBill.DiscountAmount);
      message += "Subtotal: ₹" + subtotal.toFixed(2) + "\n";
      message += "Discount: -₹" + Number(currentBill.DiscountAmount).toFixed(2) + "\n";
    }

    message +=
      "Total Amount: ₹" + currentBill.TotalAmount + "\n" +
      "Amount Paid: ₹" + currentBill.AmountPaid + "\n" +
      "Amount Due: ₹" + currentBill.AmountDue + "\n\n" +
      "Thank you for shopping with us!";

    const url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
    window.open(url, "_blank");
  }

  loadReceipt();
</script>

</body>
</html>
